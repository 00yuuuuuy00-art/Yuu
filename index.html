<script>
(function () {
  var stage = document.getElementById('stage');
  var closedImg = document.getElementById('closed');
  var openImg = document.getElementById('open');

  function setOpen(isOpen) {
    openImg.hidden = !isOpen;
    closedImg.hidden = isOpen;
  }

  stage.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    stage.focus({ preventScroll: true });
    setOpen(true);
  });
  window.addEventListener('pointerup', function () { setOpen(false); });
  window.addEventListener('pointercancel', function () { setOpen(false); });
  window.addEventListener('blur', function () { setOpen(false); });

  function isToggleKey(e) { return e.code === 'Space' || e.code === 'Enter'; }
  window.addEventListener('keydown', function (e) {
    if (!isToggleKey(e)) return;
    e.preventDefault();
    setOpen(true);
  });
  window.addEventListener('keyup', function (e) {
    if (!isToggleKey(e)) return;
    setOpen(false);
  });
})();
</script>
